# Configuración del divisor de confirmaciones EDICOM.
# Las rutas que no empiezan por letra de unidad (C:\...) ni por \\ se
# entienden relativas a la carpeta de la herramienta.

[rutas]
descargas = C:\Users\pablo.montes\Downloads
destino = \\hq.gac\files\wmn\PEDIDOS\RECADV
procesados = _procesados
registro = registro
estado = estado

[archivos]
# Qué PDFs de Descargas se consideran descargas de ediwin
patron_descargas = report - *.pdf
# Inicio del nombre de cada PDF generado
prefijo = Confirmación Recepción_
# Longitud máxima del nombre (sin ".pdf")
longitud_maxima_nombre = 120

[vigilancia]
# Cada cuántos segundos se revisa Descargas
intervalo_segundos = 5
