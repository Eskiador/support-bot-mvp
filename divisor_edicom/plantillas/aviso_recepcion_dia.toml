# Plantilla C: "Aviso de recepción Nº ..." de DIA (formato distinto a A y B).
# Verificada con ejemplos/lote6 (13/10/2026): 2 documentos de DIA, 1 página cada uno.
#
# Diferencias con las otras plantillas:
# - No hay línea de título propia: la primera línea es a la vez título y
#   cabecera ("Aviso de recepción Nº 0224304 13/10/2026 06:16:04 Pág. 1").
# - El contador "Pág. N" es de cada documento (vuelve a 1 en cada uno).
#
# Las expresiones van entre comillas simples ('...') para que la barra
# invertida \ se lea tal cual. Si algo no encaja EXACTAMENTE con estas reglas,
# el programa se detiene: no adivina.

id = "C"
nombre = "Aviso de recepción (DIA)"
tipo_registro = "Aviso de recepción DIA"
inicio_por_cabecera = true
contador = "documento"

# Cabecera de cada página (línea completa). Los segundos de la hora no se
# guardan, para poder comparar con la hora de las demás plantillas.
cabecera = '^Aviso de recepción Nº (?P<num>\S+) (?P<fecha>\d\d/\d\d/\d{4} \d\d:\d\d):\d\d Pág\. (?P<pag>\d+)$'

# Línea con el Nº de documento en la página de inicio (línea completa).
numero_doc = '^Nº Confirmación (?P<num>\S+) Nº Albarán \S+$'

# AÚN NO VERIFICADO: no hay ningún ejemplo de DIA de 2 o más páginas.
# Mientras esté en false, una página "Pág. 2" (o siguiente) hace que el
# programa se detenga. Cambiar a true SOLO tras verificarlo con un ejemplo real.
permite_continuacion = false

emisor = '^Emisor Mensaje\b'

fecha_documento = '^Fecha documento (?P<fecha>\d\d/\d\d/\d{4})\b'

pedido = '\bNº Pedido (?P<pedido>\S+)'

# Sin títulos de línea propia (ver inicio_por_cabecera). Debe ir al FINAL.
[titulos]
